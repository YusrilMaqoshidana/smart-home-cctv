services:
  # ----------------------------------------------------------------------------
  # 1. Frigate NVR (Upstream Official Image with Intel VAAPI iGPU Offloading)
  # ----------------------------------------------------------------------------
  frigate:
    container_name: cctv-frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    shm_size: "256mb"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./configs/frigate/config.yaml:/config/config.yaml
      - ${DATA_STORAGE_PATH:-./data}/frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "5000:5000"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: "6144M"
    depends_on:
      - mqtt

  # ----------------------------------------------------------------------------
  # 2. MQTT Broker (Eclipse Mosquitto for Realtime Frigate Events)
  # ----------------------------------------------------------------------------
  mqtt:
    container_name: cctv-mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ${DATA_STORAGE_PATH:-./data}/mosquitto:/mosquitto/data

  # ----------------------------------------------------------------------------
  # 3. Custom Backend REST API (Face Whitelist, Plates, Event Logs Database)
  # ----------------------------------------------------------------------------
  backend-api:
    container_name: cctv-backend-api
    build:
      context: .
      dockerfile: ./services/web_dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ${DATA_STORAGE_PATH:-./data}/db:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1024M"

  # ----------------------------------------------------------------------------
  # 4. Custom AI Workers (InsightFace, Indonesian ANPR & Optional Audio)
  # ----------------------------------------------------------------------------
  ai-workers:
    container_name: cctv-ai-workers
    build:
      context: .
      dockerfile: ./services/ai_workers/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_STORAGE_PATH:-./data}/models:/app/models
      - ${DATA_STORAGE_PATH:-./data}/db:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "3072M"

  # ----------------------------------------------------------------------------
  # 5. Custom Event Dispatcher & Telegram Gateway
  # ----------------------------------------------------------------------------
  dispatcher:
    container_name: cctv-dispatcher
    build:
      context: .
      dockerfile: ./services/dispatcher/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${DATA_STORAGE_PATH:-./data}/db:/app/data
      - ${DATA_STORAGE_PATH:-./data}/frigate/media:/media/frigate:ro
    depends_on:
      - mqtt
      - backend-api
      - ai-workers
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1024M"

  # ----------------------------------------------------------------------------
  # 6. SvelteKit SSR Web Dashboard (Tactical Surveillance Hub)
  # ----------------------------------------------------------------------------
  web-dashboard:
    container_name: cctv-web-dashboard
    build:
      context: ./services/web-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend-api:8000
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - backend-api
      - dispatcher
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1024M"
