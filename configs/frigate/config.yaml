mqtt:
  host: mqtt
  port: 1883
  topic_prefix: frigate

ffmpeg:
  hwaccel_args: preset-vaapi

detectors:
  ov:
    type: openvino
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  labelmap_path: /labelmap.txt

objects:
  track:
    - person
    - car
    - motorcycle
    - package
  filters:
    person:
      min_area: 5000
      max_area: 100000
      threshold: 0.7
    car:
      min_area: 10000
      threshold: 0.7
    motorcycle:
      min_area: 8000
      threshold: 0.7

record:
  enabled: True
  retain:
    days: 7
    mode: all
  events:
    retain:
      default: 30
      mode: active_objects

snapshots:
  enabled: True
  clean_copy: True
  timestamp: False
  bounding_box: True
  crop: True
  retain:
    default: 30

cameras:
  halaman_depan:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAMERA_FRONT_IP}:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAMERA_FRONT_IP}:554/h264Preview_01_main
          roles:
            - record
    detect:
      width: 1280
      height: 720
      fps: 7
    zones:
      perimeter_gerbang:
        coordinates: 0,720,1280,720,1280,450,0,450
        objects:
          - person
          - car
          - motorcycle
      teras_depan:
        coordinates: 400,600,900,600,900,200,400,200
        objects:
          - person
          - package

  carport:
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAMERA_CARPORT_IP}:554/h264Preview_01_sub
          roles:
            - detect
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@{CAMERA_CARPORT_IP}:554/h264Preview_01_main
          roles:
            - record
    detect:
      width: 1280
      height: 720
      fps: 7
    zones:
      area_parkir:
        coordinates: 0,720,1280,720,1280,300,0,300
        objects:
          - car
          - motorcycle
          - person
      pintu_garasi:
        coordinates: 800,500,1280,500,1280,100,800,100
        objects:
          - person
